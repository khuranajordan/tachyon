[package]
name = "tachyon"
version = "0.1.0"
edition = "2021"
authors = ["Tachyon Core Team"]
description = "A hyper-speed, intuitive, interactive version control system reconstructed from Git internals"

[dependencies]
clap = { version = "4.5", features = ["derive", "color"] }
flate2 = "1.0"
sha1 = "0.10"
rayon = "1.10"
crossterm = "0.28"
walkdir = "2.5"
chrono = "0.4"
similar = { version = "2.6", features = ["inline"] }
byteorder = "1.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
